    <rect x="15" y="3" width="2" height="3" fill="#7b5ea7"/>
  </g>

  <!-- 4: sunflower -->
  <g transform="translate(128,0)">
    <rect x="10" y="26" width="12" height="4" fill="#7a5230"/>
