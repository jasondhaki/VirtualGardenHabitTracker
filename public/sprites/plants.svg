<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 128" shape-rendering="crispEdges">
  <!-- Placeholder pixel-art plant sheet (build plan §9.4 — swap for a real
       Kenney/Cup Nooble/LimeZu tileset before shipping publicly). 5x4 grid,
       32x32 units per cell. Index order is defined in lib/garden/sprites.ts
       and must never change once a species has shipped with a spriteKey. -->

  <!-- 0: clover -->
  <g transform="translate(0,0)">
    <rect x="10" y="26" width="12" height="4" fill="#7a5230"/>
    <rect x="15" y="16" width="2" height="10" fill="#4a7c3f"/>
    <circle cx="12" cy="13" r="3" fill="#58b368"/>
    <circle cx="16" cy="10" r="3" fill="#58b368"/>
    <circle cx="20" cy="13" r="3" fill="#58b368"/>
    <circle cx="16" cy="13" r="1.5" fill="#ffffff"/>
  </g>

  <!-- 1: daisy -->
  <g transform="translate(32,0)">
    <rect x="10" y="26" width="12" height="4" fill="#7a5230"/>
    <rect x="15" y="16" width="2" height="10" fill="#4a7c3f"/>
    <circle cx="16" cy="13" r="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="0.5"/>
    <circle cx="16" cy="13" r="3" fill="#f4c542"/>
  </g>

  <!-- 2: marigold -->
